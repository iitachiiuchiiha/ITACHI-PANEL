<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Panel</title>
    <style>
      /* General Styles */
      body {
        font-family: 'Arial', sans-serif;
        background-color: #0a0a0a;
        color: #ff0000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background-color: #1a1a1a;
        border: 2px solid #ff0000;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        text-align: center;
        width: 300px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 20px;
        text-transform: uppercase;
      }

      h2 {
        font-size: 18px;
        margin: 10px 0;
        color: #ff0000;
      }

      .section {
        margin-bottom: 20px;
      }

      .button {
        background-color: #b30000;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin: 5px;
        transition: background-color 0.3s;
      }

      .button:hover {
        background-color: #800000;
      }

      .status {
        font-size: 14px;
        margin-top: 10px;
        color: #ff0000;
      }

      .version {
        font-size: 12px;
        margin-top: 20px;
        color: #ffff00; /* Yellow for version */
      }

      .safe-mode {
        font-size: 12px;
        margin-top: 10px;
        color: #00ffff; /* Cyan for safe mode */
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>CONTROL PANEL</h1>

      <!-- Stream Control Section -->
      <div class="section">
        <h2>STREAM CONTROL</h2>
        <button class="button" onclick="startStream()">STREAM ON</button>
        <button class="button" onclick="stopStream()">STREAM OFF</button>
        <div class="status" id="streamStatus">Stream Status: OFF</div>
      </div>

      <!-- Aimbot Control Section -->
      <div class="section">
        <h2>AIMBOT CONTROL</h2>
        <button class="button" onclick="injectAimbot()">INJECT</button>
        <button class="button" onclick="enableAimbot()">AIMBOT ON</button>
        <button class="button" onclick="disableAimbot()">AIMBOT OFF</button>
        <div class="status" id="aimbotStatus">Aimbot Status: DISABLED</div>
      </div>

      <!-- Version and Safe Mode -->
      <div class="version">Version 1.0.0</div>
      <div class="safe-mode">SAFE MODE: ENABLED</div>
    </div>

    <script>
      // Function to start the stream
      function startStream() {
        fetch('http://localhost:5000/stream/on')
          .then(response => response.text())
          .then(data => {
            document.getElementById('streamStatus').textContent = `Stream Status: ${data}`;
          })
          .catch(error => {
            console.error('Error:', error);
            document.getElementById('streamStatus').textContent = 'Stream Status: ERROR';
          });
      }

      // Function to stop the stream
      function stopStream() {
        fetch('http://localhost:5000/stream/off')
          .then(response => response.text())
          .then(data => {
            document.getElementById('streamStatus').textContent = `Stream Status: ${data}`;
          })
          .catch(error => {
            console.error('Error:', error);
            document.getElementById('streamStatus').textContent = 'Stream Status: ERROR';
          });
      }

      // Function to inject aimbot
      function injectAimbot() {
        fetch('http://localhost:5000/aimbot/inject')
          .then(response => response.text())
          .then(data => {
            document.getElementById('aimbotStatus').textContent = `Aimbot Status: ${data}`;
          })
          .catch(error => {
            console.error('Error:', error);
            document.getElementById('aimbotStatus').textContent = 'Aimbot Status: ERROR';
          });
      }

      // Function to enable aimbot
      function enableAimbot() {
        fetch('http://localhost:5000/aimbot/on')
          .then(response => response.text())
          .then(data => {
            document.getElementById('aimbotStatus').textContent = `Aimbot Status: ${data}`;
          })
          .catch(error => {
            console.error('Error:', error);
            document.getElementById('aimbotStatus').textContent = 'Aimbot Status: ERROR';
          });
      }

      // Function to disable aimbot
      function disableAimbot() {
        fetch('http://localhost:5000/aimbot/off')
          .then(response => response.text())
          .then(data => {
            document.getElementById('aimbotStatus').textContent = `Aimbot Status: ${data}`;
          })
          .catch(error => {
            console.error('Error:', error);
            document.getElementById('aimbotStatus').textContent = 'Aimbot Status: ERROR';
          });
      }
    </script>
  </body>
</html>
